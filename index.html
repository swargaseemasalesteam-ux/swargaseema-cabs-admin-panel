<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ameya · Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   TOKENS
══════════════════════════════════════════════ */
:root {
  --maroon:       #7A1515;
  --maroon-deep:  #5C0F0F;
  --maroon-light: #9B2020;
  --gold:         #C8920A;
  --gold-light:   #F0C84A;
  --gold-dim:     rgba(200,146,10,0.18);
  --green:        #1E6641;
  --green-bg:     #EAF5EE;
  --red:          #B71C1C;
  --red-bg:       #FDECEA;
  --amber:        #B45309;
  --amber-bg:     #FEF3C7;
  --blue:         #1D4ED8;
  --blue-bg:      #EFF6FF;

  --bg:           #F7F3EE;
  --bg2:          #EDE7DC;
  --surface:      #FFFFFF;
  --border:       #E2D9CE;
  --border2:      #D0C5B8;

  --text:         #1A100A;
  --text-mid:     #4A3728;
  --text-muted:   #8A7060;
  --text-faint:   #B0A090;

  --sb-bg:        #1A0808;
  --sb-border:    rgba(200,146,10,0.15);
  --sb-text:      rgba(255,255,255,0.65);
  --sb-active-bg: rgba(200,146,10,0.12);
  --sb-hover-bg:  rgba(255,255,255,0.06);

  --radius:       10px;
  --radius-lg:    14px;
  --shadow-sm:    0 1px 4px rgba(0,0,0,0.08);
  --shadow:       0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg:    0 12px 40px rgba(0,0,0,0.16);

  --sb-w:         256px;
  --topbar-h:     60px;
}

/* ══════════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  display: flex;
  min-height: 100vh;
  line-height: 1.5;
}
button, input, select { font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ══════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════ */
.sidebar {
  width: var(--sb-w);
  background: var(--sb-bg);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  z-index: 200;
  border-right: 1px solid var(--sb-border);
}

.sb-brand {
  padding: 1.6rem 1.4rem 1.4rem;
  border-bottom: 1px solid var(--sb-border);
}
.sb-logorow {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.6rem;
}
.sb-icon {
  width: 36px; height: 36px;
  background: var(--maroon);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
  border: 1px solid rgba(200,146,10,0.3);
}
.sb-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.01em;
}
.sb-subtitle {
  font-size: 0.68rem;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sb-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  background: var(--gold-dim);
  border: 1px solid rgba(200,146,10,0.35);
  color: var(--gold-light);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.25rem 0.65rem;
  border-radius: 20px;
}

.sb-nav {
  flex: 1;
  padding: 1.2rem 0.75rem;
  overflow-y: auto;
}
.nav-section-label {
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 0 0.6rem;
  margin: 1.2rem 0 0.4rem;
}
.nav-section-label:first-child { margin-top: 0; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.65rem 0.75rem;
  border-radius: 8px;
  color: var(--sb-text);
  cursor: pointer;
  transition: all 0.18s;
  font-size: 0.875rem;
  font-weight: 500;
  position: relative;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--sb-hover-bg); color: #fff; }
.nav-item.active {
  background: var(--sb-active-bg);
  color: var(--gold-light);
  border: 1px solid rgba(200,146,10,0.25);
}
.nav-item .ni {
  font-size: 1rem;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}
.nav-item .nb {
  margin-left: auto;
  background: var(--maroon);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.12rem 0.48rem;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}
.nav-item.active .nb { background: var(--gold); color: var(--text); }

.sb-footer {
  padding: 1rem 1.4rem;
  border-top: 1px solid var(--sb-border);
}
.sb-sync {
  font-size: 0.72rem;
  color: var(--text-faint);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.live-dot {
  width: 7px; height: 7px;
  background: #4CAF50;
  border-radius: 50%;
  animation: livepulse 2.2s ease infinite;
  flex-shrink: 0;
}
@keyframes livepulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.45; transform:scale(0.85); }
}

/* ══════════════════════════════════════════════
   MAIN
══════════════════════════════════════════════ */
.main {
  margin-left: var(--sb-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* TOPBAR */
.topbar {
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 1.75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
.topbar-left { display: flex; align-items: center; gap: 0.8rem; }
.topbar-crumb {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--maroon);
}
.topbar-right { display: flex; align-items: center; gap: 0.75rem; }
.topbar-date {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 400;
}
.topbar-btn {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.45rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  color: var(--text-mid);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
}
.topbar-btn:hover { border-color: var(--maroon); color: var(--maroon); background: #fff; }
.topbar-btn svg { width:14px; height:14px; }

/* ══════════════════════════════════════════════
   CONTENT
══════════════════════════════════════════════ */
.content { padding: 1.75rem; flex: 1; }

/* ── STAT CARDS ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.4rem;
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.stat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.stat-card.sc-total::after  { background: var(--maroon); }
.stat-card.sc-pending::after{ background: var(--amber); }
.stat-card.sc-visited::after{ background: var(--green); }
.stat-card.sc-today::after  { background: var(--blue); }

.stat-icon-wrap {
  width: 38px; height: 38px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  margin-bottom: 0.9rem;
}
.sc-total  .stat-icon-wrap { background: #FDF0F0; }
.sc-pending .stat-icon-wrap { background: var(--amber-bg); }
.sc-visited .stat-icon-wrap { background: var(--green-bg); }
.sc-today  .stat-icon-wrap { background: var(--blue-bg); }

.stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 0.3rem;
}
.sc-total  .stat-val { color: var(--maroon); }
.sc-pending .stat-val { color: var(--amber); }
.sc-visited .stat-val { color: var(--green); }
.sc-today  .stat-val { color: var(--blue); }

.stat-label {
  font-size: 0.73rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ── FILTER BAR ── */
.filter-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  display: flex;
  gap: 0.75rem;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.search-wrap {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 0.6rem 0.9rem 0.6rem 2.3rem;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  font-size: 0.875rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.18s;
}
.search-wrap input:focus { border-color: var(--maroon); background: #fff; }
.search-wrap input::placeholder { color: var(--text-faint); }
.search-icon {
  position: absolute;
  left: 0.7rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  pointer-events: none;
  font-size: 0.9rem;
}
.f-select {
  padding: 0.6rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  color: var(--text-mid);
  font-size: 0.875rem;
  font-weight: 500;
  outline: none;
  cursor: pointer;
  transition: border-color 0.18s;
  min-width: 130px;
}
.f-select:focus { border-color: var(--maroon); }

/* ── TABLE CARD ── */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.table-card-hdr {
  padding: 1rem 1.4rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #FDFAF6;
}
.table-card-hdr h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--maroon);
}
.rec-count {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg2);
  border: 1px solid var(--border2);
  padding: 0.2rem 0.7rem;
  border-radius: 20px;
}

.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead th {
  background: #FAF6F1;
  padding: 0.75rem 0.85rem;
  text-align: left;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody tr {
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #FDFAF3; }
tbody td {
  padding: 0.78rem 0.85rem;
  font-size: 0.84rem;
  color: var(--text-mid);
  vertical-align: middle;
}

/* TD helpers */
.td-ref {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--maroon);
  letter-spacing: 0.04em;
}
.td-name { font-weight: 600; color: var(--text); font-size: 0.875rem; }
.td-sub  { font-size: 0.75rem; color: var(--text-muted); margin-top: 1px; }
.td-tag {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  margin-top: 3px;
  background: var(--gold-dim);
  color: #7a5c00;
  letter-spacing: 0.04em;
}

/* STATUS BADGE */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.28rem 0.7rem;
  border-radius: 20px;
  font-size: 0.73rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.badge-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.badge-pending  { background: var(--amber-bg); color: var(--amber); }
.badge-pending .badge-dot  { background: var(--amber); }
.badge-visited  { background: var(--green-bg); color: var(--green); }
.badge-visited .badge-dot  { background: var(--green); }
.badge-cancelled{ background: var(--red-bg);  color: var(--red); }
.badge-cancelled .badge-dot{ background: var(--red); }

/* CAR CHIP */
.car-chip {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.2rem 0.6rem;
  border-radius: 6px;
}
.car-ertiga   { background: var(--blue-bg); color: var(--blue); }
.car-innova   { background: var(--green-bg); color: var(--green); }
.car-dsv      { background: #F3E5F5; color: #6A1B9A; }

/* ACTION CONTROLS */
.act-dropdown {
  padding: 0.42rem 0.7rem;
  border: 1.5px solid var(--border2);
  border-radius: 6px;
  font-size: 0.78rem;
  font-weight: 600;
  background: #fff;
  color: var(--text-mid);
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
  min-width: 130px;
}
.act-dropdown:focus { border-color: var(--maroon); }
.act-btn-done {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.42rem 0.85rem;
  border-radius: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  border: none;
  cursor: default;
  white-space: nowrap;
}
.act-btn-visited   { background: var(--green-bg); color: var(--green); }
.act-btn-cancelled { background: var(--red-bg);   color: var(--red); }

/* DRIVER DROPDOWN */
.drv-wrap { position: relative; min-width: 175px; }
.drv-trigger {
  display: flex; align-items: center; gap: 0.45rem;
  padding: 0.42rem 0.7rem;
  border: 1.5px solid var(--border2);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-mid);
  transition: border-color 0.15s;
  width: 100%;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.drv-trigger:hover { border-color: var(--maroon); }
.drv-trigger.assigned { border-color: rgba(30,102,65,0.4); background: var(--green-bg); color: var(--green); font-weight: 600; }
.drv-trigger .drv-ico { flex-shrink:0; font-size:0.85rem; }
.drv-panel {
  display: none;
  position: fixed;
  min-width: 240px;
  max-height: 300px;
  background: #fff;
  border: 1px solid var(--border2);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  z-index: 9999;
  overflow: hidden;
  flex-direction: column;
}
.drv-panel.open { display: flex; }
.drv-search {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.drv-search input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.42rem 0.7rem;
  font-size: 0.82rem;
  outline: none;
  background: var(--bg);
}
.drv-search input:focus { border-color: var(--maroon); }
.drv-list { max-height: 200px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; flex: 1; }
.drv-opt {
  padding: 0.55rem 0.85rem;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.13s;
}
.drv-opt:last-child { border-bottom: none; }
.drv-opt:hover { background: #FAF6F1; }
.drv-opt.selected { background: var(--green-bg); }
.drv-opt-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
.drv-opt-phone { font-size: 0.73rem; color: var(--text-muted); }
.drv-other-form {
  padding: 0.65rem 0.85rem;
  border-top: 1px solid var(--border);
  background: #FDFAF6;
  display: none;
}
.drv-other-form input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.42rem 0.65rem;
  font-size: 0.82rem;
  margin-bottom: 0.45rem;
  outline: none;
}
.drv-other-form input:focus { border-color: var(--maroon); }
.drv-other-submit {
  width: 100%;
  background: var(--maroon);
  color: #fff;
  border: none;
  padding: 0.48rem;
  border-radius: 6px;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.drv-other-submit:hover { background: var(--maroon-deep); }

/* ══════════════════════════════════════════════
   DETAIL DRAWER (right panel)
══════════════════════════════════════════════ */
.drawer-overlay {
  position: fixed; inset: 0;
  z-index: 400;
  background: rgba(26,8,8,0.5);
  backdrop-filter: blur(3px);
  display: none;
  opacity: 0;
  transition: opacity 0.25s;
}
.drawer-overlay.open { display: block; }
.drawer-overlay.visible { opacity: 1; }

.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 420px;
  background: var(--surface);
  z-index: 401;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.32,0,0.15,1);
  box-shadow: -8px 0 40px rgba(0,0,0,0.18);
}
.drawer.open { transform: translateX(0); }

.drw-hdr {
  padding: 1.4rem 1.6rem;
  background: var(--maroon);
  color: #fff;
  flex-shrink: 0;
}
.drw-hdr-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}
.drw-ref {
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  font-weight: 500;
  opacity: 0.75;
  letter-spacing: 0.06em;
  margin-bottom: 0.2rem;
}
.drw-name {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1.2;
}
.drw-close {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.drw-close:hover { background: rgba(255,255,255,0.22); }

.drw-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.4rem 1.6rem;
}
.drw-section-title {
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 0.75rem;
  margin-top: 1.4rem;
}
.drw-section-title:first-child { margin-top: 0; }
.drw-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}
.drw-field {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.7rem 0.85rem;
}
.drw-field.full { grid-column: 1 / -1; }
.drw-field label {
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-faint);
  display: block;
  margin-bottom: 0.2rem;
}
.drw-field span {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text);
}

.drw-footer {
  padding: 1.1rem 1.6rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
  background: #FDFAF6;
  flex-shrink: 0;
}
.drw-btn-close {
  padding: 0.65rem 1.3rem;
  border: 1px solid var(--border2);
  border-radius: 7px;
  background: #fff;
  color: var(--text-mid);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.drw-btn-close:hover { border-color: var(--maroon); color: var(--maroon); }
.drw-btn-confirm {
  padding: 0.65rem 1.4rem;
  border: none;
  border-radius: 7px;
  background: var(--green);
  color: #fff;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  display: flex; align-items: center; gap: 0.4rem;
}
.drw-btn-confirm:hover { background: #155232; }

/* ══════════════════════════════════════════════
   EMPTY / LOADING STATES
══════════════════════════════════════════════ */
.state-msg {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}
.state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.state-title { font-size: 1rem; font-weight: 600; color: var(--text-mid); margin-bottom: 0.4rem; }
.state-sub { font-size: 0.85rem; }

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
.toast-wrap {
  position: fixed;
  bottom: 1.75rem;
  right: 1.75rem;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 0.65rem;
  background: var(--text);
  color: #fff;
  padding: 0.75rem 1.1rem;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  min-width: 250px;
  max-width: 340px;
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.32,0,0.15,1);
  pointer-events: auto;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-left: 4px solid #4CAF50; }
.toast.error   { border-left: 4px solid #F44336; }
.toast-icon { flex-shrink: 0; font-size: 1rem; }

/* ══════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════ */
@media (max-width: 800px) {
  :root { --sb-w: 0px; }

}

<!-- ═══ SCRIPT ═══ -->
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbziOHvCodBfMm3ldhbWSeRZBDx6lI1rQu3Kik1nlTKbA1R-EVykQaHsGIFNLm4kD1uz/exec";

const DRIVERS = [
  {name:"Ramchander Alwal",   phone:"6305365037"},
  {name:"Mohan Malkajgiri",   phone:"7013134335"},
  {name:"Naresh Reddy Alwal", phone:"9640870886"},
  {name:"Dhanunjay",          phone:"9553307412"},
  {name:"Balapur Ramulu",     phone:"9951205080"},
  {name:"BHEL Chandrasekhar", phone:"7036036436"},
  {name:"Kukatpally Ramulu",  phone:"9948492258"},
  {name:"Hemanth Malkajgiri", phone:"9346873516"},
  {name:"Nagesh",             phone:"9542997747"},
  {name:"Anjaneyulu",         phone:"9010369323"},
  {name:"Srikanth Malkajgiri",phone:"9966990663"},
  {name:"Shakeer",            phone:"9849970507"},
  {name:"Saddam",             phone:"9665889042"},
  {name:"Chakradhar",         phone:"9948455531"},
  {name:"Sattibabu",          phone:"9010651235"}
];

// ── STATE
let allBookings = [];
let currentSection = 'today';

const DAYS  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS= ['January','February','March','April','May','June','July','August','September','October','November','December'];
const M_SH  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── INIT
document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  document.getElementById('curDate').textContent =
    DAYS[now.getDay()] + ', ' + now.getDate() + ' ' + M_SH[now.getMonth()] + ' ' + now.getFullYear();
  loadBookings();
  setInterval(silentRefresh, 60000);
});

function todayStr() {
  const n = new Date();
  return DAYS[n.getDay()] + ', ' + n.getDate() + ' ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
}

function cleanDate(raw) {
  if (!raw || raw === '—') return '—';
  raw = String(raw).trim();
  if (/^[A-Za-z]+,\s+\d+\s+[A-Za-z]+\s+\d{4}$/.test(raw)) return raw;
  const d = new Date(raw);
  if (!isNaN(d.getTime())) {
    const ist = new Date(d.getTime() + 5.5*3600000);
    return DAYS[ist.getUTCDay()] + ', ' + ist.getUTCDate() + ' ' + MONTHS[ist.getUTCMonth()] + ' ' + ist.getUTCFullYear();
  }
  return raw;
}

function cleanTime(raw) {
  if (!raw || raw === '—') return '—';
  raw = String(raw).trim();
  if (/^\d{1,2}:\d{2}\s?(AM|PM)$/i.test(raw)) return raw.toUpperCase();
  const match = raw.match(/(\d{2}):(\d{2}):\d{2}\s*GMT([+-]\d{4})/);
  if (match) {
    let rh = parseInt(match[1]), rm = parseInt(match[2]);
    const offset = match[3], oh = parseInt(offset.slice(1,3)), om = parseInt(offset.slice(3,5));
    const sign = offset[0] === '+' ? 1 : -1;
    let utcM = rh*60 + rm - sign*(oh*60 + om);
    utcM = ((utcM%1440)+1440)%1440;
    let istM = ((utcM+330)%1440+1440)%1440;
    rh = Math.floor(istM/60); rm = istM%60;
    const ap = rh < 12 ? 'AM' : 'PM';
    const dh = rh%12 === 0 ? 12 : rh%12;
    return dh + ':' + String(rm).padStart(2,'0') + ' ' + ap;
  }
  const d = new Date(raw);
  if (!isNaN(d.getTime())) {
    const h = d.getUTCHours(), m = d.getUTCMinutes();
    const ap = h<12?'AM':'PM', dh = h%12===0?12:h%12;
    return dh + ':' + String(m).padStart(2,'0') + ' ' + ap;
  }
  return raw;
}

function isToday(raw) { return cleanDate(raw) === todayStr(); }

// ── LOAD
function loadBookings() {
  document.getElementById('tableContainer').innerHTML =
    `<div class="state-msg"><div class="state-icon">⏳</div><div class="state-title">Loading bookings…</div></div>`;
  const old = document.getElementById('_jsonp_load');
  if (old) old.remove();
  window.__adminCB = function(data) {
    const now = new Date(), cm = MONTHS[now.getMonth()], cy = String(now.getFullYear());
    allBookings = (data.bookings||[]).reverse().filter(b => {
      const d = cleanDate(b['Visit Date']||'');
      return d.includes(cm) && d.includes(cy);
    });
    document.getElementById('lastSync').textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    updateStats(); populateDateFilter(); renderTable();
    showToast('✓ Bookings loaded', 'success');
  };
  const s = document.createElement('script');
  s.id = '_jsonp_load';
  s.src = SCRIPT_URL + '?callback=__adminCB&t=' + Date.now();
  s.onerror = () => {
    document.getElementById('tableContainer').innerHTML =
      `<div class="state-msg"><div class="state-icon">⚠️</div><div class="state-title">Connection Failed</div><div class="state-sub">Could not reach Google Sheet.</div></div>`;
    showToast('Failed to load bookings', 'error');
  };
  document.body.appendChild(s);
}

function silentRefresh() {
  const old = document.getElementById('_jsonp_silent');
  if (old) old.remove();
  window.__silentCB = function(data) {
    const now = new Date(), cm = MONTHS[now.getMonth()], cy = String(now.getFullYear());
    allBookings = (data.bookings||[]).reverse().filter(b => {
      const d = cleanDate(b['Visit Date']||'');
      return d.includes(cm) && d.includes(cy);
    });
    document.getElementById('lastSync').textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    updateStats(); populateDateFilter(); renderTable();
  };
  const s = document.createElement('script');
  s.id = '_jsonp_silent';
  s.src = SCRIPT_URL + '?callback=__silentCB&t=' + Date.now();
  document.body.appendChild(s);
}

// ── SCRIPT ACTION (JSONP for writes)
function scriptAction(params) {
  return new Promise((resolve, reject) => {
    const cbName = '__act_' + Date.now();
    const old = document.getElementById('_jsonp_act');
    if (old) old.remove();
    window[cbName] = function(res) { resolve(res); delete window[cbName]; };
    const qs = new URLSearchParams({...params, callback: cbName, t: Date.now()}).toString();
    const s = document.createElement('script');
    s.id = '_jsonp_act';
    s.src = SCRIPT_URL + '?' + qs;
    s.onerror = () => { reject(new Error('Failed')); delete window[cbName]; };
    document.body.appendChild(s);
  });
}

// ── STATS
function updateStats() {
  document.getElementById('sTotal').textContent = allBookings.length;
  document.getElementById('sPending').textContent = allBookings.filter(b=>(b['Status']||'').includes('Pending')).length;
  document.getElementById('sVisited').textContent = allBookings.filter(b=>(b['Status']||'').includes('Visited')).length;
  const todayCount = allBookings.filter(b=>isToday(b['Visit Date']||'')).length;
  document.getElementById('sToday').textContent = todayCount;
  document.getElementById('nbToday').textContent = todayCount;
  document.getElementById('nbPending').textContent = allBookings.filter(b=>(b['Status']||'').includes('Pending')).length;
}

function populateDateFilter() {
  const sel = document.getElementById('dateFilter');
  const dates = [...new Set(allBookings.map(b=>cleanDate(b['Visit Date']||'')).filter(d=>d&&d!=='—'))];
  sel.innerHTML = '';
  dates.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o); });
  const today = todayStr();
  const found = dates.find(d=>d.trim()===today.trim());
  sel.value = found ? found : (dates[dates.length-1] || '');
}

// ── SECTION NAV
function setSection(sec, el) {
  currentSection = sec;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const titles = {all:'📋 All Bookings', today:"📅 Today's Visits", pending:'⏳ Pending Visits', visited:'✅ Confirmed Visits'};
  const short   = {all:'All Bookings', today:"Today's Visits", pending:'Pending Visits', visited:'Confirmed Visits'};
  document.getElementById('pageTitle').textContent = titles[sec];
  document.getElementById('tableTitle').textContent = short[sec];
  renderTable();
}

// ── FILTER
function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const dt = document.getElementById('dateFilter').value;
  return allBookings.filter(b => {
    if (currentSection==='today'   && !isToday(b['Visit Date']||'')) return false;
    if (currentSection==='pending' && !(b['Status']||'').includes('Pending')) return false;
    if (currentSection==='visited' && !(b['Status']||'').includes('Visited')) return false;
    if (q && ![(b['Name']||''),(b['Mobile']||''),(b['Booking Ref']||''),(b['City']||'')].some(v=>v.toLowerCase().includes(q))) return false;
    if (st && !(b['Status']||'').includes(st)) return false;
    if (dt && cleanDate(b['Visit Date']||'')!==dt) return false;
    return true;
  });
}

// ── CAR CHIP
function carChip(ct) {
  if (!ct) return '—';
  if (ct==='Ertiga') return `<span class="car-chip car-ertiga">Ertiga</span>`;
  if (ct==='Innova') return `<span class="car-chip car-innova">Innova</span>`;
  if (ct==='DSV')    return `<span class="car-chip car-dsv">DSV</span>`;
  return `<span class="car-chip" style="background:var(--bg2);color:var(--text-mid)">${ct}</span>`;
}

// ── STATUS BADGE
function statusBadge(status) {
  const s = (status||'').toLowerCase();
  if (s.includes('visited'))   return `<span class="badge badge-visited"><span class="badge-dot"></span>Visited</span>`;
  if (s.includes('cancel'))    return `<span class="badge badge-cancelled"><span class="badge-dot"></span>Cancelled</span>`;
  return `<span class="badge badge-pending"><span class="badge-dot"></span>Pending</span>`;
}

// ── DRIVER DROPDOWN HTML
function driverDropdownHTML(bookingRef, assignedDriver) {
  const id = bookingRef.replace(/[^a-zA-Z0-9]/g,'_');
  const isAssigned = !!assignedDriver;
  const displayVal = assignedDriver || 'Assign Driver…';
  const opts = DRIVERS.map(d =>
    `<div class="drv-opt${assignedDriver===d.name+' — '+d.phone?' selected':''}"
      onclick="selectDriver('${id}','${bookingRef}','${d.name}','${d.phone}',event)">
      <div class="drv-opt-name">${d.name}</div>
      <div class="drv-opt-phone">${d.phone}</div>
    </div>`).join('') +
    `<div class="drv-opt" onclick="toggleOtherForm('${id}',event)">
      <div class="drv-opt-name">➕ Other</div>
      <div class="drv-opt-phone">Enter new driver</div>
    </div>
    <div class="drv-other-form" id="otherForm_${id}">
      <input type="text" id="oName_${id}" placeholder="Driver name" onclick="event.stopPropagation()"/>
      <input type="text" id="oPhone_${id}" placeholder="Phone number" onclick="event.stopPropagation()"/>
      <button class="drv-other-submit" onclick="confirmOther('${id}','${bookingRef}',event)">✓ Assign</button>
    </div>`;
  return `<div class="drv-wrap" id="drv_${id}">
    <button class="drv-trigger${isAssigned?' assigned':''}" id="drvBtn_${id}"
      onclick="toggleDrvPanel('${id}',event)">
      <span class="drv-ico">${isAssigned?'🚗':'🚖'}</span>
      <span id="drvLabel_${id}" style="overflow:hidden;text-overflow:ellipsis">${displayVal}</span>
    </button>
    <div class="drv-panel" id="drvPanel_${id}">
      <div class="drv-search">
        <input type="text" placeholder="🔍 Search driver…"
          oninput="filterDrvList('${id}',this.value)" onclick="event.stopPropagation()"/>
      </div>
      <div class="drv-list" id="drvList_${id}">${opts}</div>
    </div>
  </div>`;
}

function toggleDrvPanel(id, e) {
  e.stopPropagation();
  const panel = document.getElementById('drvPanel_'+id);
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.drv-panel.open').forEach(p=>p.classList.remove('open'));
  if (!isOpen) {
    const btn  = document.getElementById('drvBtn_'+id);
    const rect = btn.getBoundingClientRect();
    const panelH = 280;
    const spaceBelow = window.innerHeight - rect.bottom;
    panel.style.left  = rect.left + 'px';
    panel.style.width = Math.max(rect.width, 240) + 'px';
    if (spaceBelow < panelH && rect.top > panelH) {
      panel.style.top    = (rect.top - panelH - 4) + 'px';
      panel.style.bottom = 'auto';
    } else {
      panel.style.top    = (rect.bottom + 4) + 'px';
      panel.style.bottom = 'auto';
    }
    panel.classList.add('open');
    panel.querySelector('input').focus();
  }
}
function toggleOtherForm(id, e) {
  e.stopPropagation();
  const f = document.getElementById('otherForm_'+id);
  f.style.display = f.style.display==='block'?'none':'block';
  if (f.style.display==='block') document.getElementById('oName_'+id).focus();
}
function filterDrvList(id, q) {
  q = q.toLowerCase();
  document.querySelectorAll(`#drvList_${id} .drv-opt`).forEach(o => {
    const n = (o.querySelector('.drv-opt-name')||{}).textContent||'';
    const p = (o.querySelector('.drv-opt-phone')||{}).textContent||'';
    o.style.display = (n.toLowerCase().includes(q)||p.includes(q)) ? '' : 'none';
  });
}
async function selectDriver(id, bookingRef, name, phone, e) {
  e.stopPropagation();
  const combined = name + ' — ' + phone;
  document.getElementById('drvLabel_'+id).textContent = combined;
  document.getElementById('drvBtn_'+id).classList.add('assigned');
  document.getElementById('drvBtn_'+id).querySelector('.drv-ico').textContent = '🚗';
  document.getElementById('drvPanel_'+id).classList.remove('open');
  try {
    await scriptAction({action:'assignDriver', bookingRef, driverName:name, driverPhone:phone});
    const b = allBookings.find(x=>x['Booking Ref']===bookingRef);
    if(b) b['Assigned Driver'] = combined;
    showToast(`🚗 ${name} assigned`, 'success');
  } catch(err) { showToast('Driver assignment failed', 'error'); }
}
async function confirmOther(id, bookingRef, e) {
  e.stopPropagation();
  const name = document.getElementById('oName_'+id).value.trim();
  const phone= document.getElementById('oPhone_'+id).value.trim();
  if (!name||!phone) { alert('Enter both name and phone.'); return; }
  await selectDriver(id, bookingRef, name, phone, e);
}
document.addEventListener('click', (e) => {
  document.querySelectorAll('.drv-panel.open').forEach(p => {
    if (!p.contains(e.target) && !e.target.closest('.drv-wrap')) p.classList.remove('open');
  });
});
document.addEventListener('scroll', (e) => {
  // Only close if scroll happened outside a drv-panel
  if (!e.target.closest || !e.target.closest('.drv-panel')) {
    document.querySelectorAll('.drv-panel.open').forEach(p => p.classList.remove('open'));
  }
}, true);

// ── RENDER TABLE
function renderTable() {
  const bookings = getFiltered();
  document.getElementById('tCount').textContent = `${bookings.length} record${bookings.length!==1?'s':''}`;
  if (!bookings.length) {
    document.getElementById('tableContainer').innerHTML =
      `<div class="state-msg"><div class="state-icon">🔍</div><div class="state-title">No bookings found</div><div class="state-sub">Try adjusting your filters.</div></div>`;
    return;
  }
  const rows = bookings.map(b => {
    const ref = b['Booking Ref']||'';
    const status = b['Status']||'';
    const isDone = status.includes('Visited') || status.toLowerCase().includes('cancel');
    const isCancel = status.toLowerCase().includes('cancel');
    const actionCell = isDone
      ? `<button class="act-btn-done ${isCancel?'act-btn-cancelled':'act-btn-visited'}">${isCancel?'✕ Cancelled':'✓ Visited'}</button>`
      : `<select class="act-dropdown" onchange="changeStatus('${ref}',this,event)" onclick="event.stopPropagation()">
           <option value="">— Action —</option>
           <option value="Visited">✅ Mark Visited</option>
           <option value="Cancelled">❌ Cancelled</option>
         </select>`;
    return `<tr onclick="openDrawer('${ref}')">
      <td><div class="td-ref">${ref}</div></td>
      <td>
        <div class="td-name">${b['Name']||'—'}</div>
        <div class="td-sub">${b['Mobile']||''}</div>
        ${b['Source']==='Tele-Caller'?`<span class="td-tag">Tele-Caller</span>`:''}
      </td>
      <td><div>${cleanDate(b['Visit Date']||'')}</div><div class="td-sub">${cleanTime(b['Time Slot']||'')}</div></td>
      <td>${b['Members']||'—'}</td>
      <td>${carChip(b['Car Type']||'')}</td>
      <td>${b['City']||'—'}</td>
      <td onclick="event.stopPropagation()">${driverDropdownHTML(ref, b['Assigned Driver']||'')}</td>
      <td>${statusBadge(status)}</td>
      <td onclick="event.stopPropagation()">${actionCell}</td>
    </tr>`;
  }).join('');

  document.getElementById('tableContainer').innerHTML = `
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>Ref</th><th>Customer</th><th>Date / Time</th>
          <th>Members</th><th>Car</th><th>City</th>
          <th>Driver</th><th>Status</th><th>Action</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── STATUS CHANGE
async function changeStatus(ref, sel, e) {
  e.stopPropagation();
  const newStatus = sel.value;
  if (!newStatus) return;
  if (!confirm(`Mark ${ref} as ${newStatus}?`)) { sel.value=''; return; }
  sel.disabled = true;
  try {
    await scriptAction({action:'updateStatus', bookingRef:ref, status:newStatus});
    const b = allBookings.find(x=>x['Booking Ref']===ref);
    if(b) b['Status'] = newStatus==='Visited' ? 'Visited ✓' : 'Cancelled';
    updateStats(); renderTable();
    showToast(`${ref} marked as ${newStatus}`, 'success');
  } catch(err) {
    sel.disabled=false; sel.value='';
    showToast('Update failed. Check connection.','error');
  }
}

// ── DRAWER
function openDrawer(ref) {
  const b = allBookings.find(x=>x['Booking Ref']===ref);
  if (!b) return;
  document.getElementById('drwRef').textContent = ref;
  document.getElementById('drwName').textContent = b['Name']||'—';
  document.getElementById('drwBadge').innerHTML = statusBadge(b['Status']||'');

  const fields = [
    {l:'Mobile',      v:b['Mobile'],        },
    {l:'Email',       v:b['Email']||'—'     },
    {l:'City',        v:b['City']           },
    {l:'Occupation',  v:b['Occupation']||'—'},
    {l:'Visit Date',  v:cleanDate(b['Visit Date']||'')},
    {l:'Time Slot',   v:cleanTime(b['Time Slot']||'') },
    {l:'Members',     v:b['Members']        },
    {l:'Car Type',    v:b['Car Type']||'—'  },
    {l:'Source',      v:b['Source']||'—'    },
    {l:'Tele-Caller', v:b['Tele-Caller Name']||'—'},
    {l:'Driver',      v:b['Assigned Driver']||'Not assigned'},
    {l:'Booked On',   v:b['Booked On']||'—' },
    {l:'Pickup Address', v:b['Pickup Address']||'—', full:true},
  ];

  document.getElementById('drwBody').innerHTML =
    `<div class="drw-section-title">Contact & Details</div>
     <div class="drw-fields">
       ${fields.map(f=>`
         <div class="drw-field${f.full?' full':''}">
           <label>${f.l}</label>
           <span>${f.v||'—'}</span>
         </div>`).join('')}
     </div>`;

  const isVisited = (b['Status']||'').includes('Visited');
  const isCancel  = (b['Status']||'').toLowerCase().includes('cancel');
  document.getElementById('drwFooter').innerHTML = (isVisited||isCancel)
    ? `<button class="drw-btn-close" onclick="closeDrawer()">Close</button>
       <button class="act-btn-done ${isCancel?'act-btn-cancelled':'act-btn-visited'}" style="padding:0.65rem 1.2rem;border-radius:7px;font-size:0.85rem;">${isCancel?'✕ Cancelled':'✓ Already Visited'}</button>`
    : `<button class="drw-btn-close" onclick="closeDrawer()">Close</button>
       <button class="drw-btn-confirm" onclick="confirmFromDrawer('${ref}')">✓ Confirm Visit</button>`;

  const overlay = document.getElementById('drawerOverlay');
  const drawer  = document.getElementById('drawer');
  overlay.classList.add('open');
  setTimeout(()=>overlay.classList.add('visible'),10);
  drawer.classList.add('open');
}

function closeDrawer() {
  const overlay = document.getElementById('drawerOverlay');
  const drawer  = document.getElementById('drawer');
  overlay.classList.remove('visible');
  drawer.classList.remove('open');
  setTimeout(()=>overlay.classList.remove('open'), 300);
}

async function confirmFromDrawer(ref) {
  closeDrawer();
  try {
    await scriptAction({action:'updateStatus', bookingRef:ref, status:'Visited'});
    const b = allBookings.find(x=>x['Booking Ref']===ref);
    if(b) b['Status'] = 'Visited ✓';
    updateStats(); renderTable();
    showToast(`${ref} confirmed as Visited ✓`, 'success');
  } catch(err) { showToast('Failed to confirm.','error'); }
}

// ── TOAST
let _toastTimer = null;
function showToast(msg, type='success') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span class="toast-icon">${type==='success'?'✓':'✕'}</span><span>${msg}</span>`;
  wrap.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(), 350);
  }, 3200);
}
