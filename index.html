<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ameya · Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --maroon:#7A1515; --maroon-deep:#5C0F0F;
  --gold:#C8920A; --gold-light:#F0C84A; --gold-dim:rgba(200,146,10,0.18);
  --green:#1E6641; --green-bg:#EAF5EE;
  --red:#B71C1C; --red-bg:#FDECEA;
  --amber:#B45309; --amber-bg:#FEF3C7;
  --blue:#1D4ED8; --blue-bg:#EFF6FF;
  --bg:#F7F3EE; --bg2:#EDE7DC;
  --surface:#FFFFFF; --border:#E2D9CE; --border2:#D0C5B8;
  --text:#1A100A; --text-mid:#4A3728; --text-muted:#8A7060; --text-faint:#B0A090;
  --sb-bg:#1A0808; --sb-border:rgba(200,146,10,0.15);
  --sb-text:rgba(255,255,255,0.65); --sb-active-bg:rgba(200,146,10,0.12); --sb-hover-bg:rgba(255,255,255,0.06);
  --radius:10px; --radius-lg:14px;
  --shadow-sm:0 1px 4px rgba(0,0,0,0.08); --shadow:0 4px 16px rgba(0,0,0,0.10); --shadow-lg:0 12px 40px rgba(0,0,0,0.18);
  --sb-w:256px; --topbar-h:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);display:flex;min-height:100vh;line-height:1.5;}
button,input,select{font-family:inherit;}

/* SIDEBAR */
.sidebar{width:var(--sb-w);background:var(--sb-bg);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:200;border-right:1px solid var(--sb-border);}
.sb-brand{padding:1.6rem 1.4rem 1.4rem;border-bottom:1px solid var(--sb-border);}
.sb-logorow{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.6rem;}
.sb-icon{width:36px;height:36px;background:var(--maroon);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;border:1px solid rgba(200,146,10,0.3);}
.sb-title{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:600;color:#fff;}
.sb-subtitle{font-size:0.68rem;color:var(--text-faint);letter-spacing:0.08em;text-transform:uppercase;}
.sb-badge{display:inline-flex;align-items:center;gap:0.3rem;background:var(--gold-dim);border:1px solid rgba(200,146,10,0.35);color:var(--gold-light);font-size:0.65rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:0.25rem 0.65rem;border-radius:20px;}
.sb-nav{flex:1;padding:1.2rem 0.75rem;overflow-y:auto;}
.nav-section-label{font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-faint);padding:0 0.6rem;margin:1.2rem 0 0.4rem;}
.nav-section-label:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:0.7rem;padding:0.65rem 0.75rem;border-radius:8px;color:var(--sb-text);cursor:pointer;transition:all 0.18s;font-size:0.875rem;font-weight:500;position:relative;margin-bottom:2px;}
.nav-item:hover{background:var(--sb-hover-bg);color:#fff;}
.nav-item.active{background:var(--sb-active-bg);color:var(--gold-light);border:1px solid rgba(200,146,10,0.25);}
.nav-item .ni{font-size:1rem;width:20px;text-align:center;flex-shrink:0;}
.nav-item .nb{margin-left:auto;background:var(--maroon);color:#fff;font-size:0.68rem;font-weight:700;padding:0.12rem 0.48rem;border-radius:10px;min-width:20px;text-align:center;}
.nav-item.active .nb{background:var(--gold);color:var(--text);}
.sb-footer{padding:1rem 1.4rem;border-top:1px solid var(--sb-border);}
.sb-sync{font-size:0.72rem;color:var(--text-faint);display:flex;align-items:center;gap:0.4rem;}
.live-dot{width:7px;height:7px;background:#4CAF50;border-radius:50%;animation:livepulse 2.2s ease infinite;flex-shrink:0;}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.45;transform:scale(0.85);}}

/* MAIN */
.main{margin-left:var(--sb-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.75rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
.topbar-crumb{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:600;color:var(--maroon);}
.topbar-right{display:flex;align-items:center;gap:0.75rem;}
.topbar-date{font-size:0.8rem;color:var(--text-muted);}
.topbar-btn{display:flex;align-items:center;gap:0.4rem;padding:0.45rem 0.9rem;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text-mid);font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.18s;}
.topbar-btn:hover{border-color:var(--maroon);color:var(--maroon);background:#fff;}

/* CONTENT */
.content{padding:1.75rem;flex:1;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.4rem;position:relative;overflow:hidden;transition:box-shadow 0.2s,transform 0.2s;}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.sc-total::after{background:var(--maroon);}.sc-pending::after{background:var(--amber);}.sc-visited::after{background:var(--green);}.sc-today::after{background:var(--blue);}
.stat-icon-wrap{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:0.9rem;}
.sc-total .stat-icon-wrap{background:#FDF0F0;}.sc-pending .stat-icon-wrap{background:var(--amber-bg);}.sc-visited .stat-icon-wrap{background:var(--green-bg);}.sc-today .stat-icon-wrap{background:var(--blue-bg);}
.stat-val{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;line-height:1;margin-bottom:0.3rem;}
.sc-total .stat-val{color:var(--maroon);}.sc-pending .stat-val{color:var(--amber);}.sc-visited .stat-val{color:var(--green);}.sc-today .stat-val{color:var(--blue);}
.stat-label{font-size:0.73rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);}

/* FILTERS */
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem;box-shadow:var(--shadow-sm);}
.search-wrap{flex:1;min-width:200px;position:relative;}
.search-wrap input{width:100%;padding:0.6rem 0.9rem 0.6rem 2.3rem;border:1px solid var(--border);border-radius:7px;background:var(--bg);font-size:0.875rem;color:var(--text);outline:none;transition:border-color 0.18s;}
.search-wrap input:focus{border-color:var(--maroon);background:#fff;}
.search-wrap input::placeholder{color:var(--text-faint);}
.search-icon{position:absolute;left:0.7rem;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;}
.f-select{padding:0.6rem 0.9rem;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text-mid);font-size:0.875rem;font-weight:500;outline:none;cursor:pointer;min-width:130px;}
.f-select:focus{border-color:var(--maroon);}

/* TABLE */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
.table-card-hdr{padding:1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#FDFAF6;}
.table-card-hdr h3{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;color:var(--maroon);}
.rec-count{font-size:0.75rem;font-weight:600;color:var(--text-muted);background:var(--bg2);border:1px solid var(--border2);padding:0.2rem 0.7rem;border-radius:20px;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;min-width:860px;}
thead th{background:#FAF6F1;padding:0.75rem 0.85rem;text-align:left;font-size:0.68rem;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#FDFAF3;}
tbody td{padding:0.78rem 0.85rem;font-size:0.84rem;color:var(--text-mid);vertical-align:middle;}
.td-ref{font-family:'DM Mono',monospace;font-size:0.75rem;font-weight:500;color:var(--maroon);}
.td-name{font-weight:600;color:var(--text);font-size:0.875rem;}
.td-sub{font-size:0.75rem;color:var(--text-muted);margin-top:1px;}
.td-tag{display:inline-block;font-size:0.68rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:10px;margin-top:3px;background:var(--gold-dim);color:#7a5c00;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:0.3rem;padding:0.28rem 0.7rem;border-radius:20px;font-size:0.73rem;font-weight:700;white-space:nowrap;}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.badge-pending{background:var(--amber-bg);color:var(--amber);}.badge-pending .badge-dot{background:var(--amber);}
.badge-visited{background:var(--green-bg);color:var(--green);}.badge-visited .badge-dot{background:var(--green);}
.badge-cancelled{background:var(--red-bg);color:var(--red);}.badge-cancelled .badge-dot{background:var(--red);}
.car-chip{display:inline-block;font-size:0.72rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:6px;}
.car-ertiga{background:var(--blue-bg);color:var(--blue);}.car-innova{background:var(--green-bg);color:var(--green);}.car-dsv{background:#F3E5F5;color:#6A1B9A;}

/* ACTION */
.act-dropdown{padding:0.42rem 0.7rem;border:1.5px solid var(--border2);border-radius:6px;font-size:0.78rem;font-weight:600;background:#fff;color:var(--text-mid);cursor:pointer;outline:none;min-width:130px;}
.act-btn-done{display:inline-flex;align-items:center;gap:0.35rem;padding:0.42rem 0.85rem;border-radius:6px;font-size:0.78rem;font-weight:700;border:none;cursor:default;white-space:nowrap;}
.act-btn-visited{background:var(--green-bg);color:var(--green);}
.act-btn-cancelled{background:var(--red-bg);color:var(--red);}

/* DRIVER BUTTON */
.drv-btn{display:flex;align-items:center;gap:0.45rem;padding:0.42rem 0.75rem;border:1.5px solid var(--border2);border-radius:6px;background:#fff;cursor:pointer;font-size:0.78rem;font-weight:500;color:var(--text-mid);max-width:185px;overflow:hidden;transition:border-color 0.15s;width:100%;}
.drv-btn:hover,.drv-btn:active{border-color:var(--maroon);}
.drv-btn.assigned{border-color:rgba(30,102,65,0.4);background:var(--green-bg);color:var(--green);font-weight:600;}
.drv-btn-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left;}

/* DRIVER BOTTOM SHEET MODAL */
.drv-overlay{position:fixed;inset:0;z-index:3000;background:rgba(26,8,8,0.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:0;}
.drv-overlay.open{display:flex;}
.drv-sheet{background:#fff;width:100%;max-width:500px;max-height:80vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;animation:sheetUp 0.3s cubic-bezier(0.32,0,0.15,1);}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.drv-sheet-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0.75rem auto 0;}
.drv-sheet-hdr{padding:0.75rem 1.25rem 0.75rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.drv-sheet-hdr h4{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--maroon);}
.drv-sheet-close{background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--text-mid);}
.drv-sheet-search{padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;}
.drv-sheet-search input{width:100%;padding:0.6rem 0.9rem 0.6rem 2.3rem;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;outline:none;background:var(--bg);}
.drv-sheet-search input:focus{border-color:var(--maroon);}
.drv-sheet-search::before{content:'🔍';position:absolute;left:1.9rem;top:50%;transform:translateY(-50%);font-size:0.85rem;pointer-events:none;}
.drv-sheet-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.drv-sheet-opt{padding:0.85rem 1.25rem;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:0.85rem;transition:background 0.12s;}
.drv-sheet-opt:last-child{border-bottom:none;}
.drv-sheet-opt:hover,.drv-sheet-opt:active{background:var(--bg);}
.drv-sheet-opt.selected{background:var(--green-bg);}
.drv-sheet-opt-name{font-size:0.9rem;font-weight:600;color:var(--text);}
.drv-sheet-opt-phone{font-size:0.78rem;color:var(--text-muted);}
.drv-sheet-other{padding:0.85rem 1.25rem;border-top:2px solid var(--border);background:#FDFAF6;flex-shrink:0;}
.drv-sheet-other-lbl{font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.5rem;}
.drv-sheet-other input{width:100%;padding:0.55rem 0.8rem;border:1px solid var(--border);border-radius:7px;font-size:0.875rem;outline:none;margin-bottom:0.4rem;}
.drv-sheet-other input:focus{border-color:var(--maroon);}
.drv-sheet-other-btn{width:100%;background:var(--maroon);color:#fff;border:none;padding:0.65rem;border-radius:7px;font-size:0.875rem;font-weight:700;cursor:pointer;margin-top:0.2rem;}
.drv-sheet-other-btn:active{background:var(--maroon-deep);}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;z-index:400;background:rgba(26,8,8,0.5);backdrop-filter:blur(3px);display:none;opacity:0;transition:opacity 0.25s;}
.drawer-overlay.open{display:block;}
.drawer-overlay.visible{opacity:1;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;background:var(--surface);z-index:401;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.3s cubic-bezier(0.32,0,0.15,1);box-shadow:-8px 0 40px rgba(0,0,0,0.18);}
.drawer.open{transform:translateX(0);}
.drw-hdr{padding:1.4rem 1.6rem;background:var(--maroon);color:#fff;flex-shrink:0;}
.drw-hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.5rem;}
.drw-ref{font-family:'DM Mono',monospace;font-size:0.8rem;opacity:0.75;letter-spacing:0.06em;margin-bottom:0.2rem;}
.drw-name{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:600;line-height:1.2;}
.drw-close{background:rgba(255,255,255,0.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.drw-body{flex:1;overflow-y:auto;padding:1.4rem 1.6rem;}
.drw-section-title{font-size:0.67rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:0.75rem;margin-top:1.4rem;}
.drw-section-title:first-child{margin-top:0;}
.drw-fields{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;}
.drw-field{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.7rem 0.85rem;}
.drw-field.full{grid-column:1/-1;}
.drw-field label{font-size:0.67rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);display:block;margin-bottom:0.2rem;}
.drw-field span{font-size:0.875rem;font-weight:600;color:var(--text);}
.drw-footer{padding:1.1rem 1.6rem;border-top:1px solid var(--border);display:flex;gap:0.75rem;justify-content:flex-end;background:#FDFAF6;flex-shrink:0;}
.drw-btn-close{padding:0.65rem 1.3rem;border:1px solid var(--border2);border-radius:7px;background:#fff;color:var(--text-mid);font-size:0.85rem;font-weight:600;cursor:pointer;}
.drw-btn-confirm{padding:0.65rem 1.4rem;border:none;border-radius:7px;background:var(--green);color:#fff;font-size:0.85rem;font-weight:700;cursor:pointer;}

/* STATES */
.state-msg{text-align:center;padding:4rem 2rem;color:var(--text-muted);}
.state-icon{font-size:2.5rem;margin-bottom:0.75rem;}
.state-title{font-size:1rem;font-weight:600;color:var(--text-mid);margin-bottom:0.4rem;}

/* TOAST */
.toast-wrap{position:fixed;bottom:1.75rem;right:1.75rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none;}
.toast{display:flex;align-items:center;gap:0.65rem;background:var(--text);color:#fff;padding:0.75rem 1.1rem;border-radius:10px;font-size:0.85rem;font-weight:500;box-shadow:var(--shadow-lg);min-width:250px;max-width:340px;transform:translateY(20px);opacity:0;transition:all 0.3s cubic-bezier(0.32,0,0.15,1);pointer-events:auto;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-left:4px solid #4CAF50;}
.toast.error{border-left:4px solid #F44336;}

/* MOBILE */
@media(max-width:800px){
  :root{--sb-w:0px;}
  .sidebar{width:100%;height:62px;top:auto;bottom:0;left:0;flex-direction:row;border-top:1px solid var(--sb-border);border-right:none;}
  .sb-brand,.sb-footer{display:none;}
  .sb-nav{display:flex;flex-direction:row;padding:0;width:100%;justify-content:space-around;}
  .nav-section-label{display:none;}
  .nav-item{flex-direction:column;gap:0.15rem;padding:0.5rem 0.4rem;font-size:0.6rem;border-radius:0;min-width:55px;border:none !important;flex:1;justify-content:center;text-align:center;margin-bottom:0;border-bottom:3px solid transparent !important;}
  .nav-item.active{background:transparent;border-bottom-color:var(--gold-light) !important;}
  .nav-item .ni{font-size:1.2rem;}
  .nav-item .nb{position:absolute;top:4px;right:4px;font-size:0.58rem;padding:0.1rem 0.3rem;}
  .main{margin-left:0;padding-bottom:62px;}
  .stats-row{grid-template-columns:1fr 1fr;gap:0.75rem;}
  .content{padding:0.9rem;}
  .stat-card{padding:1rem 1rem;}
  .stat-val{font-size:1.8rem;}
  .drawer{width:100%;}
  .drw-fields{grid-template-columns:1fr;}
  .toast-wrap{left:1rem;right:1rem;bottom:80px;}
  .toast{min-width:0;max-width:100%;}
  .topbar{padding:0 1rem;}
  .topbar-date{display:none;}
  .topbar-crumb{font-size:1rem;}
}
/* Desktop: center the driver sheet */
@media(min-width:801px){
  .drv-overlay{align-items:center;padding:1rem;}
  .drv-sheet{border-radius:16px;max-height:560px;}
  .drv-sheet-handle{display:none;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-logorow">
      <div class="sb-icon">🏡</div>
      <div><div class="sb-title">Ameya</div><div class="sb-subtitle">Swargaseema</div></div>
    </div>
    <div class="sb-badge">⚙ Admin Panel</div>
  </div>
  <nav class="sb-nav">
    <div class="nav-section-label">Visits</div>
    <div class="nav-item active" onclick="setSection('today',this)"><span class="ni">📅</span><span>Today</span><span class="nb" id="nbToday">0</span></div>
    <div class="nav-item" onclick="setSection('pending',this)"><span class="ni">⏳</span><span>Pending</span><span class="nb" id="nbPending">0</span></div>
    <div class="nav-item" onclick="setSection('visited',this)"><span class="ni">✅</span><span>Visited</span></div>
    <div class="nav-section-label">All</div>
    <div class="nav-item" onclick="setSection('all',this)"><span class="ni">📋</span><span>All</span></div>
  </nav>
  <div class="sb-footer">
    <div class="sb-sync"><span class="live-dot"></span>Synced <span id="lastSync" style="margin-left:0.2rem">—</span></div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <span class="topbar-crumb" id="pageTitle">📅 Today's Visits</span>
    <div class="topbar-right">
      <span class="topbar-date" id="curDate"></span>
      <button class="topbar-btn" onclick="loadBookings()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content">
    <div class="stats-row">
      <div class="stat-card sc-total"><div class="stat-icon-wrap">📊</div><div class="stat-val" id="sTotal">0</div><div class="stat-label">Total</div></div>
      <div class="stat-card sc-pending"><div class="stat-icon-wrap">⏳</div><div class="stat-val" id="sPending">0</div><div class="stat-label">Pending</div></div>
      <div class="stat-card sc-visited"><div class="stat-icon-wrap">✅</div><div class="stat-val" id="sVisited">0</div><div class="stat-label">Visited</div></div>
      <div class="stat-card sc-today"><div class="stat-icon-wrap">🗓️</div><div class="stat-val" id="sToday">0</div><div class="stat-label">Today</div></div>
    </div>
    <div class="filter-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search name, phone, ref…" oninput="renderTable()">
      </div>
      <select class="f-select" id="statusFilter" onchange="renderTable()">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Visited">Visited</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select class="f-select" id="dateFilter" onchange="renderTable()"></select>
    </div>
    <div class="table-card">
      <div class="table-card-hdr">
        <h3 id="tableTitle">Today's Visits</h3>
        <span class="rec-count" id="tCount">0 records</span>
      </div>
      <div id="tableContainer">
        <div class="state-msg"><div class="state-icon">⏳</div><div class="state-title">Loading bookings…</div></div>
      </div>
    </div>
  </div>
</main>

<!-- DRIVER BOTTOM SHEET -->
<div class="drv-overlay" id="drvOverlay">
  <div class="drv-sheet">
    <div class="drv-sheet-handle"></div>
    <div class="drv-sheet-hdr">
      <h4>🚗 Assign Driver</h4>
      <button class="drv-sheet-close" onclick="closeDrvSheet()">✕</button>
    </div>
    <div class="drv-sheet-search">
      <input type="text" id="drvSearch" placeholder="Search name or phone…" oninput="filterDrvSheet(this.value)">
    </div>
    <div class="drv-sheet-list" id="drvSheetList"></div>
    <div class="drv-sheet-other">
      <div class="drv-sheet-other-lbl">➕ Other Driver</div>
      <input type="text" id="drvOtherName" placeholder="Driver name">
      <input type="text" id="drvOtherPhone" placeholder="Phone number">
      <button class="drv-sheet-other-btn" onclick="assignOtherDriver()">✓ Assign This Driver</button>
    </div>
  </div>
</div>

<!-- DETAIL DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drw-hdr">
    <div class="drw-hdr-top">
      <div><div class="drw-ref" id="drwRef">—</div><div class="drw-name" id="drwName">—</div></div>
      <button class="drw-close" onclick="closeDrawer()">✕</button>
    </div>
    <div id="drwBadge"></div>
  </div>
  <div class="drw-body" id="drwBody"></div>
  <div class="drw-footer" id="drwFooter"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbziOHvCodBfMm3ldhbWSeRZBDx6lI1rQu3Kik1nlTKbA1R-EVykQaHsGIFNLm4kD1uz/exec";

const DRIVERS = [
  {name:"Ramchander Alwal",phone:"6305365037"},{name:"Mohan Malkajgiri",phone:"7013134335"},
  {name:"Naresh Reddy Alwal",phone:"9640870886"},{name:"Dhanunjay",phone:"9553307412"},
  {name:"Balapur Ramulu",phone:"9951205080"},{name:"BHEL Chandrasekhar",phone:"7036036436"},
  {name:"Kukatpally Ramulu",phone:"9948492258"},{name:"Hemanth Malkajgiri",phone:"9346873516"},
  {name:"Nagesh",phone:"9542997747"},{name:"Anjaneyulu",phone:"9010369323"},
  {name:"Srikanth Malkajgiri",phone:"9966990663"},{name:"Shakeer",phone:"9849970507"},
  {name:"Saddam",phone:"9665889042"},{name:"Chakradhar",phone:"9948455531"},
  {name:"Sattibabu",phone:"9010651235"}
];

let allBookings = [];
let currentSection = 'today';
let _activeRef = null;

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const M_SH   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

document.addEventListener('DOMContentLoaded',()=>{
  const now=new Date();
  document.getElementById('curDate').textContent=
    DAYS[now.getDay()]+', '+now.getDate()+' '+M_SH[now.getMonth()]+' '+now.getFullYear();
  loadBookings();
  setInterval(silentRefresh,60000);
  // Close driver sheet when tapping the dark overlay
  document.getElementById('drvOverlay').addEventListener('click',function(e){
    if(e.target===this) closeDrvSheet();
  });
});

function todayStr(){const n=new Date();return DAYS[n.getDay()]+', '+n.getDate()+' '+MONTHS[n.getMonth()]+' '+n.getFullYear();}

function cleanDate(raw){
  if(!raw||raw==='—')return '—';
  raw=String(raw).trim();
  if(/^[A-Za-z]+,\s+\d+\s+[A-Za-z]+\s+\d{4}$/.test(raw))return raw;
  const d=new Date(raw);
  if(!isNaN(d.getTime())){const ist=new Date(d.getTime()+5.5*3600000);return DAYS[ist.getUTCDay()]+', '+ist.getUTCDate()+' '+MONTHS[ist.getUTCMonth()]+' '+ist.getUTCFullYear();}
  return raw;
}
function cleanTime(raw){
  if(!raw||raw==='—')return '—';
  raw=String(raw).trim();
  if(/^\d{1,2}:\d{2}\s?(AM|PM)$/i.test(raw))return raw.toUpperCase();
  const m=raw.match(/(\d{2}):(\d{2}):\d{2}\s*GMT([+-]\d{4})/);
  if(m){let rh=parseInt(m[1]),rm=parseInt(m[2]);const o=m[3],oh=parseInt(o.slice(1,3)),om=parseInt(o.slice(3,5)),sg=o[0]==='+'?1:-1;let u=rh*60+rm-sg*(oh*60+om);u=((u%1440)+1440)%1440;let i=((u+330)%1440+1440)%1440;rh=Math.floor(i/60);rm=i%60;const ap=rh<12?'AM':'PM',dh=rh%12===0?12:rh%12;return dh+':'+String(rm).padStart(2,'0')+' '+ap;}
  const d=new Date(raw);if(!isNaN(d.getTime())){const h=d.getUTCHours(),mn=d.getUTCMinutes(),ap=h<12?'AM':'PM',dh=h%12===0?12:h%12;return dh+':'+String(mn).padStart(2,'0')+' '+ap;}
  return raw;
}
function isToday(raw){return cleanDate(raw)===todayStr();}

function loadBookings(){
  document.getElementById('tableContainer').innerHTML='<div class="state-msg"><div class="state-icon">⏳</div><div class="state-title">Loading…</div></div>';
  const old=document.getElementById('_jl');if(old)old.remove();
  window.__adminCB=function(data){
    const now=new Date(),cm=MONTHS[now.getMonth()],cy=String(now.getFullYear());
    allBookings=(data.bookings||[]).reverse().filter(b=>{const d=cleanDate(b['Visit Date']||'');return d.includes(cm)&&d.includes(cy);});
    document.getElementById('lastSync').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    updateStats();populateDateFilter();renderTable();
    showToast('✓ Bookings loaded','success');
  };
  const s=document.createElement('script');s.id='_jl';
  s.src=SCRIPT_URL+'?callback=__adminCB&t='+Date.now();
  s.onerror=()=>{document.getElementById('tableContainer').innerHTML='<div class="state-msg"><div class="state-icon">⚠️</div><div class="state-title">Connection Failed</div></div>';showToast('Failed to load','error');};
  document.body.appendChild(s);
}
function silentRefresh(){
  const old=document.getElementById('_js');if(old)old.remove();
  window.__silentCB=function(data){
    const now=new Date(),cm=MONTHS[now.getMonth()],cy=String(now.getFullYear());
    allBookings=(data.bookings||[]).reverse().filter(b=>{const d=cleanDate(b['Visit Date']||'');return d.includes(cm)&&d.includes(cy);});
    document.getElementById('lastSync').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    updateStats();populateDateFilter();renderTable();
  };
  const s=document.createElement('script');s.id='_js';s.src=SCRIPT_URL+'?callback=__silentCB&t='+Date.now();document.body.appendChild(s);
}
function scriptAction(params){
  return new Promise((resolve,reject)=>{
    const cb='__act_'+Date.now();const old=document.getElementById('_ja');if(old)old.remove();
    window[cb]=function(res){resolve(res);delete window[cb];};
    const qs=new URLSearchParams({...params,callback:cb,t:Date.now()}).toString();
    const s=document.createElement('script');s.id='_ja';s.src=SCRIPT_URL+'?'+qs;
    s.onerror=()=>{reject(new Error('Failed'));delete window[cb];};
    document.body.appendChild(s);
  });
}

function updateStats(){
  document.getElementById('sTotal').textContent=allBookings.length;
  document.getElementById('sPending').textContent=allBookings.filter(b=>(b['Status']||'').includes('Pending')).length;
  document.getElementById('sVisited').textContent=allBookings.filter(b=>(b['Status']||'').includes('Visited')).length;
  const tc=allBookings.filter(b=>isToday(b['Visit Date']||'')).length;
  document.getElementById('sToday').textContent=tc;
  document.getElementById('nbToday').textContent=tc;
  document.getElementById('nbPending').textContent=allBookings.filter(b=>(b['Status']||'').includes('Pending')).length;
}
function populateDateFilter(){
  const sel=document.getElementById('dateFilter');
  const dates=[...new Set(allBookings.map(b=>cleanDate(b['Visit Date']||'')).filter(d=>d&&d!=='—'))];
  sel.innerHTML='';dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
  const found=dates.find(d=>d.trim()===todayStr().trim());
  sel.value=found||dates[dates.length-1]||'';
}
function setSection(sec,el){
  currentSection=sec;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));el.classList.add('active');
  const t={all:'📋 All Bookings',today:"📅 Today's Visits",pending:'⏳ Pending',visited:'✅ Visited'};
  const s={all:'All Bookings',today:"Today's Visits",pending:'Pending Visits',visited:'Confirmed Visits'};
  document.getElementById('pageTitle').textContent=t[sec];document.getElementById('tableTitle').textContent=s[sec];
  renderTable();
}
function getFiltered(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const st=document.getElementById('statusFilter').value;
  const dt=document.getElementById('dateFilter').value;
  return allBookings.filter(b=>{
    if(currentSection==='today'&&!isToday(b['Visit Date']||''))return false;
    if(currentSection==='pending'&&!(b['Status']||'').includes('Pending'))return false;
    if(currentSection==='visited'&&!(b['Status']||'').includes('Visited'))return false;
    if(q&&![(b['Name']||''),(b['Mobile']||''),(b['Booking Ref']||''),(b['City']||'')].some(v=>v.toLowerCase().includes(q)))return false;
    if(st&&!(b['Status']||'').includes(st))return false;
    if(dt&&cleanDate(b['Visit Date']||'')!==dt)return false;
    return true;
  });
}
function carChip(ct){
  if(!ct)return'—';
  if(ct==='Ertiga')return`<span class="car-chip car-ertiga">Ertiga</span>`;
  if(ct==='Innova')return`<span class="car-chip car-innova">Innova</span>`;
  if(ct==='DSV')return`<span class="car-chip car-dsv">DSV</span>`;
  return`<span class="car-chip" style="background:var(--bg2);color:var(--text-mid)">${ct}</span>`;
}
function statusBadge(status){
  const s=(status||'').toLowerCase();
  if(s.includes('visited'))return`<span class="badge badge-visited"><span class="badge-dot"></span>Visited</span>`;
  if(s.includes('cancel'))return`<span class="badge badge-cancelled"><span class="badge-dot"></span>Cancelled</span>`;
  return`<span class="badge badge-pending"><span class="badge-dot"></span>Pending</span>`;
}

function renderTable(){
  const bookings=getFiltered();
  document.getElementById('tCount').textContent=`${bookings.length} record${bookings.length!==1?'s':''}`;
  if(!bookings.length){
    document.getElementById('tableContainer').innerHTML='<div class="state-msg"><div class="state-icon">🔍</div><div class="state-title">No bookings found</div></div>';return;
  }
  const rows=bookings.map(b=>{
    const ref=b['Booking Ref']||'',status=b['Status']||'';
    const isDone=status.includes('Visited')||status.toLowerCase().includes('cancel');
    const isCancel=status.toLowerCase().includes('cancel');
    const assigned=b['Assigned Driver']||'';
    const safeRef=ref.replace(/[^a-z0-9]/gi,'_');
    const actionCell=isDone
      ?`<button class="act-btn-done ${isCancel?'act-btn-cancelled':'act-btn-visited'}">${isCancel?'✕ Cancelled':'✓ Visited'}</button>`
      :`<select class="act-dropdown" onchange="changeStatus('${ref}',this,event)" onclick="event.stopPropagation()">
          <option value="">— Action —</option>
          <option value="Visited">✅ Mark Visited</option>
          <option value="Cancelled">❌ Cancelled</option>
        </select>`;
    return`<tr onclick="openDrawer('${ref}')">
      <td><div class="td-ref">${ref}</div></td>
      <td><div class="td-name">${b['Name']||'—'}</div><div class="td-sub">${b['Mobile']||''}</div>${b['Source']==='Tele-Caller'?'<span class="td-tag">Tele-Caller</span>':''}</td>
      <td><div>${cleanDate(b['Visit Date']||'')}</div><div class="td-sub">${cleanTime(b['Time Slot']||'')}</div></td>
      <td>${b['Members']||'—'}</td>
      <td>${carChip(b['Car Type']||'')}</td>
      <td>${b['City']||'—'}</td>
      <td onclick="event.stopPropagation()">
        <button class="drv-btn${assigned?' assigned':''}" id="drvBtn_${safeRef}" onclick="openDrvSheet('${ref}')">
          <span>${assigned?'🚗':'🚖'}</span>
          <span class="drv-btn-label">${assigned||'Assign Driver…'}</span>
        </button>
      </td>
      <td>${statusBadge(status)}</td>
      <td onclick="event.stopPropagation()">${actionCell}</td>
    </tr>`;
  }).join('');
  document.getElementById('tableContainer').innerHTML=`<div class="tbl-scroll"><table><thead><tr><th>Ref</th><th>Customer</th><th>Date / Time</th><th>Members</th><th>Car</th><th>City</th><th>Driver</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ── DRIVER BOTTOM SHEET
function openDrvSheet(bookingRef){
  _activeRef=bookingRef;
  const assigned=(allBookings.find(b=>b['Booking Ref']===bookingRef)||{})['Assigned Driver']||'';
  // Build list
  document.getElementById('drvSheetList').innerHTML=DRIVERS.map(d=>{
    const val=d.name+' — '+d.phone;
    return`<div class="drv-sheet-opt${assigned===val?' selected':''}" onclick="assignDriver('${d.name.replace(/'/g,"\\'")}','${d.phone}')">
      <span style="font-size:1.2rem">${assigned===val?'✅':'🚗'}</span>
      <div><div class="drv-sheet-opt-name">${d.name}</div><div class="drv-sheet-opt-phone">${d.phone}</div></div>
    </div>`;
  }).join('');
  // Reset
  document.getElementById('drvSearch').value='';
  document.getElementById('drvOtherName').value='';
  document.getElementById('drvOtherPhone').value='';
  filterDrvSheet('');
  document.getElementById('drvOverlay').classList.add('open');
}
function closeDrvSheet(){
  document.getElementById('drvOverlay').classList.remove('open');
  _activeRef=null;
}
function filterDrvSheet(q){
  q=q.toLowerCase();
  document.querySelectorAll('#drvSheetList .drv-sheet-opt').forEach(o=>{
    const n=(o.querySelector('.drv-sheet-opt-name')||{}).textContent||'';
    const p=(o.querySelector('.drv-sheet-opt-phone')||{}).textContent||'';
    o.style.display=(n.toLowerCase().includes(q)||p.includes(q))?'':'none';
  });
}
async function assignDriver(name,phone){
  const bookingRef=_activeRef;if(!bookingRef)return;
  const combined=name+' — '+phone;
  closeDrvSheet();
  // Update button
  const safeRef=bookingRef.replace(/[^a-z0-9]/gi,'_');
  const btn=document.getElementById('drvBtn_'+safeRef);
  if(btn){btn.classList.add('assigned');btn.innerHTML=`<span>🚗</span><span class="drv-btn-label">${combined}</span>`;}
  // Update local
  const b=allBookings.find(x=>x['Booking Ref']===bookingRef);if(b)b['Assigned Driver']=combined;
  try{await scriptAction({action:'assignDriver',bookingRef,driverName:name,driverPhone:phone});showToast(`🚗 ${name} assigned`,'success');}
  catch(err){showToast('Assignment failed','error');}
}
async function assignOtherDriver(){
  const name=document.getElementById('drvOtherName').value.trim();
  const phone=document.getElementById('drvOtherPhone').value.trim();
  if(!name||!phone){showToast('Enter both name and phone','error');return;}
  await assignDriver(name,phone);
}

// ── STATUS
async function changeStatus(ref,sel,e){
  e.stopPropagation();const newStatus=sel.value;if(!newStatus)return;
  if(!confirm(`Mark ${ref} as ${newStatus}?`)){sel.value='';return;}
  sel.disabled=true;
  try{
    await scriptAction({action:'updateStatus',bookingRef:ref,status:newStatus});
    const b=allBookings.find(x=>x['Booking Ref']===ref);
    if(b)b['Status']=newStatus==='Visited'?'Visited ✓':'Cancelled';
    updateStats();renderTable();showToast(`${ref} → ${newStatus}`,'success');
  }catch(err){sel.disabled=false;sel.value='';showToast('Update failed','error');}
}

// ── DRAWER
function openDrawer(ref){
  const b=allBookings.find(x=>x['Booking Ref']===ref);if(!b)return;
  document.getElementById('drwRef').textContent=ref;
  document.getElementById('drwName').textContent=b['Name']||'—';
  document.getElementById('drwBadge').innerHTML=statusBadge(b['Status']||'');
  const fields=[
    {l:'Mobile',v:b['Mobile']},{l:'Email',v:b['Email']||'—'},
    {l:'City',v:b['City']},{l:'Occupation',v:b['Occupation']||'—'},
    {l:'Visit Date',v:cleanDate(b['Visit Date']||'')},{l:'Time Slot',v:cleanTime(b['Time Slot']||'')},
    {l:'Members',v:b['Members']},{l:'Car Type',v:b['Car Type']||'—'},
    {l:'Source',v:b['Source']||'—'},{l:'Tele-Caller',v:b['Tele-Caller Name']||'—'},
    {l:'Driver',v:b['Assigned Driver']||'Not assigned'},{l:'Booked On',v:b['Booked On']||'—'},
    {l:'Pickup Address',v:b['Pickup Address']||'—',full:true},
  ];
  document.getElementById('drwBody').innerHTML=
    `<div class="drw-section-title">Contact & Details</div><div class="drw-fields">${fields.map(f=>`<div class="drw-field${f.full?' full':''}"><label>${f.l}</label><span>${f.v||'—'}</span></div>`).join('')}</div>`;
  const isVisited=(b['Status']||'').includes('Visited'),isCancel=(b['Status']||'').toLowerCase().includes('cancel');
  document.getElementById('drwFooter').innerHTML=(isVisited||isCancel)
    ?`<button class="drw-btn-close" onclick="closeDrawer()">Close</button><button class="act-btn-done ${isCancel?'act-btn-cancelled':'act-btn-visited'}" style="padding:0.65rem 1.2rem;border-radius:7px;font-size:0.85rem;">${isCancel?'✕ Cancelled':'✓ Already Visited'}</button>`
    :`<button class="drw-btn-close" onclick="closeDrawer()">Close</button><button class="drw-btn-confirm" onclick="confirmFromDrawer('${ref}')">✓ Confirm Visit</button>`;
  const ov=document.getElementById('drawerOverlay'),dr=document.getElementById('drawer');
  ov.classList.add('open');setTimeout(()=>ov.classList.add('visible'),10);dr.classList.add('open');
}
function closeDrawer(){
  const ov=document.getElementById('drawerOverlay'),dr=document.getElementById('drawer');
  ov.classList.remove('visible');dr.classList.remove('open');setTimeout(()=>ov.classList.remove('open'),300);
}
async function confirmFromDrawer(ref){
  closeDrawer();
  try{
    await scriptAction({action:'updateStatus',bookingRef:ref,status:'Visited'});
    const b=allBookings.find(x=>x['Booking Ref']===ref);if(b)b['Status']='Visited ✓';
    updateStats();renderTable();showToast(`${ref} confirmed ✓`,'success');
  }catch(err){showToast('Failed to confirm','error');}
}

// ── TOAST
function showToast(msg,type='success'){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');t.className=`toast ${type}`;
  t.innerHTML=`<span>${type==='success'?'✓':'✕'}</span><span>${msg}</span>`;
  wrap.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350);},3200);
}
</script>
